<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ondas de IA · The AI Sea</title>
<meta name="description" content="Receba as Ondas de IA no seu e-mail: as notícias de IA que importam, explicadas de um jeito prático.">
<meta property="og:title" content="Ondas de IA · The AI Sea">
<meta property="og:description" content="As notícias de IA que importam, direto no seu e-mail.">
<meta property="og:image" content="https://raw.githubusercontent.com/contact154/tas-assets/main/banners/rodape-pt.jpg">
<link rel="icon" href="dophing.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --rosa:#f84dac; --coral:#ff7271; --escuro:#1d1d1d; --cinza:#303030; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:Montserrat,Arial,sans-serif; background:var(--escuro); color:#fff;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .card { width:100%; max-width:440px; background:var(--cinza); border-radius:20px; padding:32px 24px; text-align:center;
          box-shadow:0 10px 40px rgba(0,0,0,.4); }
  .lang { display:flex; justify-content:flex-end; gap:6px; margin-bottom:8px; }
  .lang button { background:none; border:1px solid #555; color:#bbb; border-radius:20px; padding:4px 10px;
                 font:600 12px Montserrat,sans-serif; cursor:pointer; }
  .lang button.on { border-color:var(--rosa); color:#fff; background:rgba(248,77,172,.15); }
  img.mascote { width:110px; height:auto; margin:4px auto 12px; display:block; }
  h1 { font-size:28px; font-weight:800; line-height:1.15; }
  h1 span { background:linear-gradient(90deg,var(--rosa),var(--coral)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p.sub { color:#ccc; font-size:15px; line-height:1.5; margin:12px 0 24px; }
  input[type=email] { width:100%; padding:15px 16px; border-radius:12px; border:2px solid #555; background:#1d1d1d;
                      color:#fff; font:500 16px Montserrat,sans-serif; outline:none; }
  input[type=email]:focus { border-color:var(--rosa); }
  button.ok { width:100%; margin-top:12px; padding:15px; border:0; border-radius:12px; cursor:pointer;
              background:linear-gradient(90deg,var(--rosa),var(--coral)); color:#fff; font:800 16px Montserrat,sans-serif; }
  button.ok:disabled { opacity:.6; cursor:wait; }
  .hp { position:absolute; left:-9999px; }
  .msg { margin-top:16px; font-size:14px; min-height:20px; }
  .msg.erro { color:var(--coral); }
  .feito h2 { font-size:24px; font-weight:800; margin-bottom:10px; }
  .feito a { display:inline-block; margin-top:18px; color:#fff; text-decoration:none; border:2px solid var(--rosa);
             padding:12px 20px; border-radius:12px; font-weight:700; }
  small { display:block; color:#888; font-size:12px; margin-top:22px; line-height:1.5; }
  small a { color:#bbb; }
</style>
</head>
<body>
<main class="card">
  <div class="lang"><button data-l="pt">PT</button><button data-l="en">EN</button></div>
  <img class="mascote" src="dophing.png" alt="">
  <div id="form-box">
    <h1 data-t="titulo"></h1>
    <p class="sub" data-t="sub"></p>
    <form id="f" novalidate>
      <input type="email" id="email" required autocomplete="email" inputmode="email">
      <input type="text" name="site" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="ok" type="submit" data-t="botao"></button>
    </form>
    <div class="msg" id="msg"></div>
  </div>
  <div id="feito-box" class="feito" hidden>
    <h2 data-t="feitoTit"></h2>
    <p class="sub" data-t="feitoSub"></p>
    <a id="link-ondas" target="_blank" rel="noopener" data-t="verOndas"></a>
  </div>
  <small><span data-t="rodape"></span> <a href="mailto:contact@theaisea.com">contact@theaisea.com</a></small>
</main>
<script>
const WEBHOOK = "https://n8n.web.theaisea.com/webhook/ondas-inscricao";
const NOTION = { pt: "https://theaisea.notion.site/3e6c425b7592811e81fbf17b32ab9fcb",
                 en: "https://theaisea.notion.site/3e6c425b75928154ae45ea4931a31680" };
const T = {
  pt: { titulo: "Receba as <span>Ondas de IA</span> no seu e-mail",
        sub: "As notícias de IA que importam, explicadas de um jeito prático: o que mudou e como usar.",
        ph: "seu@email.com", botao: "Quero receber 🌊", enviando: "Enviando…",
        invalido: "Confere o e-mail, parece que falta alguma coisa.",
        falha: "Não deu certo agora. Tenta de novo em instantes.",
        feitoTit: "Pronto, você está na lista! 🌊",
        feitoSub: "As próximas Ondas de IA chegam direto no seu e-mail. Enquanto isso, as de hoje estão aqui:",
        verOndas: "Ver as Ondas de hoje", rodape: "Sem spam. Cancele quando quiser. Dúvidas:",
        doc: "Ondas de IA · The AI Sea" },
  en: { titulo: "Get the <span>AI Waves</span> in your inbox",
        sub: "The AI news that matters, explained in a practical way: what changed and how to use it.",
        ph: "you@email.com", botao: "Sign me up 🌊", enviando: "Sending…",
        invalido: "Please check your email, something looks off.",
        falha: "Something went wrong. Please try again in a moment.",
        feitoTit: "You're on the list! 🌊",
        feitoSub: "The next AI Waves will land straight in your inbox. Meanwhile, today's are here:",
        verOndas: "See today's Waves", rodape: "No spam. Unsubscribe anytime. Questions:",
        doc: "AI Waves · The AI Sea" }
};
const qs = new URLSearchParams(location.search);
let lang = (qs.get("lang") || (navigator.language || "pt")).toLowerCase().startsWith("en") ? "en" : "pt";
function aplicar() {
  const t = T[lang];
  document.documentElement.lang = lang === "en" ? "en" : "pt-BR";
  document.title = t.doc;
  document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = t[el.dataset.t]; });
  document.getElementById("email").placeholder = t.ph;
  document.getElementById("link-ondas").href = NOTION[lang];
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.l; aplicar(); });
aplicar();

document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const t = T[lang], msg = document.getElementById("msg"), btn = e.target.querySelector("button.ok");
  const email = document.getElementById("email").value.trim().toLowerCase();
  msg.className = "msg"; msg.textContent = "";
  if (e.target.site.value) return;               // robô preencheu o campo escondido
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { msg.className = "msg erro"; msg.textContent = t.invalido; return; }
  btn.disabled = true; btn.textContent = t.enviando;
  try {
    // form-urlencoded + no-cors: pedido simples, o n8n lê body.email
    await fetch(WEBHOOK + "?lang=" + lang + "&origem=" + encodeURIComponent(qs.get("origem") || "bio"),
      { method: "POST", mode: "no-cors", body: new URLSearchParams({ email }) });
    document.getElementById("form-box").hidden = true;
    document.getElementById("feito-box").hidden = false;
  } catch (err) {
    msg.className = "msg erro"; msg.textContent = t.falha;
    btn.disabled = false; btn.textContent = t.botao;
  }
});
</script>
</body>
</html>
