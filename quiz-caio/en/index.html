<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where to start automating</title>
<meta name="description" content="4 quick questions to find out where your company should start automating.">
<meta property="og:title" content="Where should your company start automating?">
<meta property="og:description" content="4 questions, under 1 minute. Find your starting point.">
<meta property="og:image" content="https://contact154.github.io/tas-assets/quiz-caio/assets/dophing-aponta.png">
<meta property="og:type" content="website">
<link rel="icon" href="../assets/dophing-sorriso.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121212; --panel:#1d1d1d; --panel2:#303030; --ink:#fff; --muted:#b9b9b9;
    --pink:#f84dac; --coral:#ff7271; --ok:#2ee59d;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
  .top{font-weight:900;font-size:clamp(18px,4.5vw,26px);text-align:center;max-width:560px;margin:8px 0 14px;line-height:1.2}
  .top em{font-style:normal;color:var(--pink)}
  .progress{display:flex;gap:6px;margin-bottom:12px}
  .progress i{width:34px;height:5px;border-radius:3px;background:var(--panel2);transition:background .3s}
  .progress i.on{background:var(--pink)}

  /* Palco 9:16 */
  .stage{position:relative;width:min(420px,100%,calc(78vh * 9 / 16));aspect-ratio:9/16;background:var(--panel);
         border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  /* Placeholder quando não há vídeo gravado */
  .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:radial-gradient(circle at 50% 35%,#2a2a2a 0,#1d1d1d 60%)}
  /* Golfinho Dophing da marca no lugar do apresentador */
  .avatar{width:40%;margin-bottom:22%;border-radius:50%;background:radial-gradient(circle at 50% 55%,rgba(248,77,172,.22),transparent 70%);
          display:flex;align-items:center;justify-content:center}
  .avatar img{width:100%;height:auto;filter:drop-shadow(0 10px 24px rgba(0,0,0,.45))}
  .avatar.talk img{animation:talk .42s ease-in-out infinite alternate}
  .avatar.talk{animation:glow 1.2s ease-in-out infinite}
  @keyframes talk{from{transform:translateY(0) scale(1) rotate(-1deg)}to{transform:translateY(-4px) scale(1.035) rotate(1deg)}}
  @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(248,77,172,.35)}50%{box-shadow:0 0 0 16px rgba(248,77,172,0)}}
  .phTag{margin-top:10px;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  .caption{position:absolute;left:6%;right:6%;bottom:9%;text-align:center;font-weight:600;
           font-size:clamp(15px,4vw,19px);line-height:1.35;text-shadow:0 2px 8px #000}
  .caption b{color:var(--pink);font-weight:900}

  /* Overlay de pergunta (estilo do Reel: escurece e mostra botões) */
  .overlay{position:absolute;inset:0;background:rgba(10,10,10,.82);backdrop-filter:blur(3px);
           display:none;flex-direction:column;justify-content:center;padding:8%;gap:10px;animation:fade .35s}
  .overlay.show{display:flex}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .q{font-weight:900;font-size:clamp(19px,5vw,24px);line-height:1.2;margin-bottom:8px}
  .opt{all:unset;cursor:pointer;background:var(--ok);color:#0d0d0d;font-weight:600;font-size:clamp(14px,3.8vw,16px);
       padding:14px 16px;border-radius:12px;text-align:center;transition:transform .12s,filter .12s}
  .opt:hover{transform:translateY(-1px);filter:brightness(1.07)}
  .opt:focus-visible{outline:3px solid var(--pink);outline-offset:2px}

  /* Tela inicial */
  .start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
         background:rgba(0,0,0,.55);cursor:pointer}
  .play{width:84px;height:84px;border-radius:50%;background:var(--pink);display:flex;align-items:center;justify-content:center}
  .play:after{content:"";border-left:26px solid #fff;border-top:16px solid transparent;border-bottom:16px solid transparent;margin-left:6px}
  .start span{font-weight:600}

  /* Formulário e resultado */
  form{display:flex;flex-direction:column;gap:9px}
  input{font:inherit;padding:13px 14px;border-radius:10px;border:1px solid #444;background:#151515;color:#fff}
  input:focus{outline:2px solid var(--pink);border-color:transparent}
  .small{font-size:12px;color:var(--muted);line-height:1.4}
  .err{color:var(--coral);font-size:13px;min-height:1em}
  .cta{all:unset;cursor:pointer;text-align:center;font-weight:900;padding:15px 16px;border-radius:12px;
       background:linear-gradient(90deg,var(--pink),var(--coral));color:#fff;font-size:clamp(15px,4vw,17px)}
  .result{overflow:auto;justify-content:flex-start;padding-top:46%;background:var(--panel);backdrop-filter:none}
  /* No resultado, o vídeo vira um quadro pequeno no topo e continua falando */
  .stage.final video,.stage.final .ph{inset:auto;top:14px;left:50%;transform:translateX(-50%);width:22%;height:auto;
       aspect-ratio:9/16;border-radius:12px;z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.5)}
  .stage.final .avatar{width:80%;margin-bottom:0}
  .stage.final .phTag,.stage.final .caption{display:none}
  .result h3{margin:0 0 6px;font-weight:900;font-size:clamp(18px,4.8vw,22px)}
  .result ul{margin:6px 0 12px;padding-left:18px;line-height:1.45;font-size:14px}
  .pill{display:inline-block;background:var(--panel2);border-radius:999px;padding:4px 10px;font-size:12px;margin:0 4px 4px 0}

  .controls{display:flex;gap:10px;margin-top:10px}
  .controls button{all:unset;cursor:pointer;font-size:12px;color:var(--muted);padding:6px 10px;border:1px solid #333;border-radius:8px}
  .foot{margin-top:14px;font-size:11px;color:#777;text-align:center;max-width:420px}
</style>
</head>
<body>

<div class="top">Before investing in automation, find out <em>where to start</em></div>
<div class="progress" id="progress"><i></i><i></i><i></i><i></i></div>

<div class="stage" id="stage">
  <video id="vid" playsinline preload="auto" hidden></video>
  <div class="ph" id="ph">
    <div class="avatar" id="avatar"><img src="../assets/dophing-aponta.png" alt="The AI Sea dolphin"></div>
    <div class="phTag" id="phTag">preview without recorded video</div>
  </div>
  <div class="caption" id="caption"></div>
  <div class="overlay" id="overlay" role="dialog" aria-live="polite"></div>
  <div class="start" id="start" role="button" tabindex="0" aria-label="Watch with sound">
    <div class="play"></div><span>Tap to watch with sound</span>
  </div>
</div>

<div class="controls">
  <button id="mute">🔊 Sound on</button>
  <button id="restart">↺ Restart</button>
</div>
<div class="foot">Your data is only used to send your result and for the team to contact you. No spam.</div>

<script>
/* ================== CONFIG ==================
   - src: caminho do .mp4 gravado (ex.: "videos/01_intro.mp4"). Vazio = prévia com voz do navegador.
   - webhook: URL do n8n que recebe o lead (vazio = só mostra no console).
   - ctaUrl: para onde o botão final leva. */
const CONFIG = {
  webhook: "https://n8n.web.theaisea.com/webhook/caio-vsl-quiz",
  ctaUrl: "https://theaisea.com/en/chief-ai-officer",
  segments: {
    intro:        {src:"", text:"Before you invest in automation, answer four quick questions. At the end, I'll tell you where your company should start. It takes less than a minute."},
    q1:           {src:"", text:"First: how many people work at your company?"},
    q2:           {src:"", text:"Now the most important one: where does your team lose the most time today?"},
    r_atendimento:{src:"", text:"Customer service and sales is where automation usually shows results fastest: answering, qualifying and booking without a queue. But it only works if the process is clear first."},
    r_operacao:   {src:"", text:"Operations hides hours of repeated work: spreadsheets, orders, double-checking. The secret is choosing the right process, not the most visible one."},
    r_financeiro: {src:"", text:"Finance and reporting are great for automation, because they follow clear rules. The risk is automating a mistake. That's why the diagnosis comes first."},
    r_naosei:     {src:"", text:"Not knowing where to start is the most common case. And the most expensive, because the company tries tool after tool without solving the problem."},
    q3:           {src:"", text:"Have you already tried to automate anything in your company?"},
    q4:           {src:"", text:"Last one: when do you want to solve this?"},
    captura:      {src:"", text:"Done. Tell me where to send your result."},
    final:        {src:"", text:"The next step is a ten to fifteen minute diagnosis with a digital consultant in the form of an agent. It understands your case, points out what to automate first, and you receive a proposal with a fixed scope and timeline before anything is built. You don't need to understand technology. Get ahead of your competitors."}
  }
};

const QUESTIONS = [
  {key:"tamanho", seg:"q1", q:"How many people work at your company?",
   opts:[["1-10","1 to 10"],["11-50","11 to 50"],["51-200","51 to 200"],["200+","More than 200"]]},
  {key:"dor", seg:"q2", q:"Where does your team lose the most time today?",
   opts:[["atendimento","Customer service and sales"],["operacao","Operations and back office"],["financeiro","Finance and reporting"],["naosei","I don't know where to start"]],
   after: v => "r_"+v},
  {key:"ia", seg:"q3", q:"Have you already tried to automate anything?",
   opts:[["nao","Not yet"],["chatgpt","Just ChatGPT on its own"],["ferramenta","We bought a tool and it didn't stick"],["parado","We have a stalled project"]]},
  {key:"urgencia", seg:"q4", q:"When do you want to solve this?",
   opts:[["mes","This month"],["3meses","In the next 3 months"],["explorando","Just exploring"]]}
];

/* Texto do resultado personalizado (sem preço, sem números de ROI). */
const RESULT = {
  dor: {
    atendimento:{t:"Start with customer service", b:["Map the questions that repeat the most","Define what the agent answers and what goes to a person","Qualify and book without a queue"]},
    operacao:   {t:"Start with one operations process", b:["List the week's repeated tasks","Pick the highest-volume one, not the most visible","Automate with human checks at first"]},
    financeiro: {t:"Start with reports and reconciliations", b:["Validate the rules before automating","Centralize the data sources","Automate the report that eats the most hours"]},
    naosei:     {t:"Start with the diagnosis, not the tool", b:["Find out where the team's time goes","Prioritize 1 process with a fast return","Only then choose the technology"]}
  },
  ia: {
    nao:"A good starting point: there are no tool habits to undo.",
    chatgpt:"Using ChatGPT on its own helps the person, but it doesn't change the process. The gain comes when automation enters the workflow.",
    ferramenta:"A tool that didn't stick is almost always the wrong process chosen first.",
    parado:"Stalled projects usually get stuck on open scope. Fixed scope and timeline solve that."
  }
};

/* ================== MOTOR ================== */
const $ = id => document.getElementById(id);
const vid=$("vid"), ph=$("ph"), cap=$("caption"), ov=$("overlay"), avatar=$("avatar");
let muted=false, answers={}, step=0, token=0;
const utm = Object.fromEntries(new URLSearchParams(location.search));
const log = (ev,data={}) => { console.log("[vsl]",ev,data); (window.dataLayer=window.dataLayer||[]).push({event:"vsl_"+ev,...data}); };

function setProgress(n){ [...$("progress").children].forEach((el,i)=>el.classList.toggle("on",i<n)); }

/* Voz da prévia: arquivos audio/<trecho>.mp3 (Francisca, +20%). Legenda acompanha o tempo do áudio. */
const aud=new Audio();
function speak(key,text){
  return new Promise(res=>{
    const words=text.split(/\s+/);
    let fallbackMs=Math.max(1500, words.length/3.5*1000);   // sem áudio: ritmo ~3,5 palavras/s
    let t0=performance.now(), done=false;
    const show=frac=>{ const i=Math.min(words.length,Math.ceil(frac*words.length));
      cap.innerHTML=words.slice(Math.max(0,i-7),i).join(" ").replace(/(automation|diagnosis|right process|fixed scope and timeline)/g,"<b>$1</b>"); };
    const tick=setInterval(()=>{
      const frac = (aud.duration && !aud.paused) ? aud.currentTime/aud.duration : (performance.now()-t0)/fallbackMs;
      show(frac);
    },80);
    avatar.classList.add("talk");
    const finish=()=>{ if(done) return; done=true; clearInterval(tick); show(1); avatar.classList.remove("talk"); setTimeout(res,200); };
    aud.onended=finish;
    aud.onerror=()=>{ t0=performance.now(); setTimeout(finish,fallbackMs); };
    aud.src=`audio/${key}.mp3`; aud.muted=muted;
    aud.play().then(()=>{ t0=performance.now(); }).catch(()=>{ t0=performance.now(); setTimeout(finish,fallbackMs); });
  });
}

function play(segKey){
  const my=++token; const s=CONFIG.segments[segKey]; log("segment",{seg:segKey});
  if(s.src){
    ph.hidden=true; vid.hidden=false; cap.textContent="";
    return new Promise(res=>{ vid.src=s.src; vid.muted=muted; vid.onended=()=>my===token&&res(); vid.play().catch(()=>{ vid.muted=true; vid.play().catch(()=>res()); }); });
  }
  ph.hidden=false; vid.hidden=true;
  return speak(segKey,s.text).then(()=>{ if(my!==token) return new Promise(()=>{}); });
}

function ask(q){
  return new Promise(res=>{
    ov.innerHTML=`<div class="q">${q.q}</div>`+q.opts.map(([v,l])=>`<button class="opt" data-v="${v}">${l}</button>`).join("");
    ov.classList.add("show"); cap.textContent="";
    ov.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ ov.classList.remove("show"); res(b.dataset.v); });
    ov.querySelector(".opt").focus({preventScroll:true});
  });
}

function score(a){
  let s=0;
  s+={"1-10":10,"11-50":25,"51-200":30,"200+":30}[a.tamanho]||0;
  s+={mes:40,"3meses":25,explorando:5}[a.urgencia]||0;
  s+={nao:15,chatgpt:20,ferramenta:30,parado:30}[a.ia]||0;
  return Math.min(100,s);
}

function capture(){
  return new Promise(res=>{
    ov.innerHTML=`
      <div class="q">Where should I send your result?</div>
      <form id="f" novalidate>
        <input name="nome" placeholder="Your name" autocomplete="name" required>
        <input name="email" type="email" placeholder="Your best email" autocomplete="email" required>
        <input name="whatsapp" type="tel" placeholder="Phone (optional)" autocomplete="tel">
        <div class="err" id="err"></div>
        <button class="cta" type="submit">See my result</button>
        <div class="small">We only use it to send your result and for the team to reach you.</div>
      </form>`;
    ov.classList.add("show");
    $("f").onsubmit=e=>{
      e.preventDefault();
      const d=Object.fromEntries(new FormData(e.target)); d.nome=d.nome.trim(); d.email=d.email.trim();
      if(d.nome.length<2) return $("err").textContent="Please enter your name.";
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email)) return $("err").textContent="Check your email.";
      const tel=(d.whatsapp||"").replace(/\D/g,"");
      if(tel && (tel.length<8||tel.length>15)) return $("err").textContent="Check the phone number or leave it blank.";
      ov.classList.remove("show"); res({...d, whatsapp:tel});
    };
  });
}

async function send(payload){
  log("lead",payload);
  try{ localStorage.setItem("caio_vsl_lead",JSON.stringify(payload)); }catch(e){}
  if(!CONFIG.webhook) return;
  try{ await fetch(CONFIG.webhook,{method:"POST",mode:"no-cors",keepalive:true,body:new URLSearchParams({data:JSON.stringify(payload)})}); log("webhook",{enviado:true}); }
  catch(e){ console.warn("webhook falhou",e); }
}

function showResult(a,lead){
  const r=RESULT.dor[a.dor];
  const nome=lead.nome.split(" ")[0].replace(/[<>&"]/g,"");
  ov.className="overlay show result"; $("stage").classList.add("final");
  ov.innerHTML=`
    <div class="small">${nome}'s result</div>
    <h3>${r.t}</h3>
    <div><span class="pill">${QUESTIONS[0].opts.find(o=>o[0]===a.tamanho)[1]} people</span><span class="pill">${QUESTIONS[3].opts.find(o=>o[0]===a.urgencia)[1]}</span></div>
    <ul>${r.b.map(x=>`<li>${x}</li>`).join("")}</ul>
    <div class="small" style="margin-bottom:12px">${RESULT.ia[a.ia]}</div>
    <a class="cta" id="cta" href="${CONFIG.ctaUrl}" target="_blank" rel="noopener">Book my diagnosis (10–15 min)</a>
    <div class="small" style="margin-top:8px">Proposal with a fixed scope and timeline before anything is built.</div>`;
  $("cta").onclick=()=>log("cta_click",{dor:a.dor});
}

async function run(){
  answers={}; step=0; setProgress(0); ov.className="overlay"; $("stage").classList.remove("final"); log("start",{utm});
  await play("intro");
  for(const q of QUESTIONS){
    await play(q.seg);
    const v=await ask(q); answers[q.key]=v; setProgress(++step); log("answer",{q:q.key,v});
    if(q.after) await play(q.after(v));
  }
  await play("captura");
  const lead=await capture();
  const payload={answers, lead, score:score(answers), origem:"vsl-quiz-caio-en", utm, ts:new Date().toISOString()};
  send(payload);
  showResult(answers,lead);
  play("final");
}

function begin(){ $("start").remove(); run(); }
$("start").onclick=begin;
$("start").onkeydown=e=>{ if(e.key==="Enter"||e.key===" ") begin(); };
$("mute").onclick=()=>{ muted=!muted; vid.muted=muted; aud.muted=muted;
  $("mute").textContent=muted?"🔇 Muted":"🔊 Sound on"; };
$("restart").onclick=()=>{ token++; aud.pause(); vid.pause(); run(); };
$("phTag").hidden=true;  // golfinho + voz já é a versão apresentável
</script>
</body>
</html>
